<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found. Shivaliva Shanty</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon_32.png" sizes="32x32" type="image/png">
<style>
:root{--bg:#08101A;--bg-void:#02060D;--panel:#121B27;--card:#202A36;--border-hair:rgba(184,161,122,0.45);--border-chip:rgba(184,161,122,0.22);--accent:#FFC845;--accent-glow:rgba(255,200,69,0.34);--text:#EFE7D8;--text-muted:#AAA498;--text-caption:#C6BDA8;--font-ui:'DejaVu Sans','Bitstream Vera Sans',Verdana,Geneva,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 18px/1.55 var(--font-ui);position:relative;isolation:isolate;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0;z-index:-2;background:url(/assets/hero_bg.jpg) center 40%/cover no-repeat;opacity:.4}
body::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,6,13,0.7) 0%,rgba(8,16,26,0.5) 50%,var(--bg) 100%)}
main{max-width:560px;padding:32px 16px;text-align:center}
.wordmark{width:min(100%,360px);margin:0 auto 24px}
.label{display:inline-block;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--text-caption);padding-bottom:4px;border-bottom:1px solid var(--accent);margin-bottom:12px}
h1{font-size:28px;line-height:1.2;color:var(--accent);margin:0 0 12px;font-weight:400}
p{margin:0 0 24px;color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;font:inherit;line-height:1.2;padding:12px 24px;border-radius:4px;border:1px solid var(--border-hair);background:var(--card);color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.muted{font-size:14px;color:var(--text-muted);margin-top:32px}
</style>
</head>
<body>
<main>
  <img class="wordmark" src="/assets/wordmark_1200.png" width="1200" height="350" alt="Shivaliva Shanty">
  <span class="label">404</span>
  <h1>Nothing docked at this address.</h1>
  <p>This page does not exist. If you followed an old link, that app is gone and this address is now the home of Shivaliva Shanty, a sky-pirate puzzle adventure.</p>
  <div class="row">
    <a class="btn btn-primary" href="/">Go to the site</a>
    <a class="btn" href="/press/">Press kit</a>
    <a class="btn" href="https://tairoyzone.itch.io/shivaliva-shanty">Download on itch</a>
  </div>
  <p class="muted">Trojan Bulldog. Made in Godot.</p>
</main>
</body>
</html>
