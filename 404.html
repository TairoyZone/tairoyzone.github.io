<style>
/* GitHub Pages serves this at any missing address, so every path in it is root-absolute */
body { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 480px at 50% 0%, #E2EDF9 0%, rgba(226, 237, 249, 0) 70%), var(--paper); }
main { max-width: 600px; padding: 40px 20px; text-align: center; display: grid; justify-items: center; gap: 18px; }
.mark { width: min(100%, 380px); height: auto; }
.code { display: inline-flex; align-items: center; gap: 10px; font: 700 0.8rem/1 var(--font-display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--gem); }

p { color: var(--ink-2); }
.btn-row { justify-content: center; margin-top: 8px; }
.small { margin-top: 18px; }

<body>
<main>
  <img class="mark" src="/assets/logo_clean_1200.png" width="1200" height="280" alt="Shivaliva">
